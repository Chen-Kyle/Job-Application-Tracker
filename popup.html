<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="themes.css">
  <script src="theme.js" defer></script>
  <script src="store.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Save a job</h1>
  <p class="hint">Capture this page, then adjust any details.</p>
  <form id="job-form">
    <label for="role">Role</label>
    <input id="role" required maxlength="300" placeholder="Software Engineer">
    <label for="company">Company</label>
    <input id="company" maxlength="200" placeholder="Company name">
    <label for="url">Job link</label>
    <input id="url" type="url" required>
    <button id="save" type="submit" disabled>Loading page…</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <button id="dashboard" type="button">Open dashboard</button>
  <h2>Saved jobs <span id="count">0</span></h2>
  <p id="empty" class="hint">Your saved jobs will appear here.</p>
  <ul id="jobs"></ul>
</body>
</html>
